<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рулетка honestiTG</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a1424;--panel:#11233b;--panel-soft:#163050;--ink:#eef6ff;
  --mute:#9bb2c8;--line:rgba(150,200,240,.2);--accent:#3f9be0;
  --accent2:#2467b0;--gold:#d6efff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  color:var(--ink);font:400 15px/1.45 "Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#24507f 0%,#12294a 40%,var(--bg) 78%);
}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;isolation:isolate;max-width:420px;width:100%;padding:28px 18px 42px;text-align:center;overflow:hidden}
main:before,main:after{content:"";position:absolute;z-index:-1;width:170px;height:170px;opacity:.22;pointer-events:none;background:radial-gradient(ellipse at center,#7cc4ff 0 8%,transparent 9%);filter:blur(26px)}
main:before{top:130px;left:-90px}
main:after{right:-90px;bottom:100px}
h1{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.6px;margin:4px 0 7px;color:#f2f9ff}
h1 span{background:linear-gradient(100deg,#bfe6ff,#5db3f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:13px;margin:0 auto 22px;max-width:290px}
.reel-wrap{position:relative;margin:0 auto 21px;width:100%;max-width:340px}
.reel-frame{position:relative;width:100%;aspect-ratio:1.38/1;border-radius:16px;overflow:hidden;border:2px solid #8ccaf5;box-shadow:0 10px 32px rgba(0,10,30,.5),0 0 0 5px rgba(140,202,245,.1),0 0 28px rgba(91,170,235,.22);background:var(--panel)}
.reel-strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.reel-strip img{display:block;width:100%;height:auto;aspect-ratio:1.38/1;object-fit:cover;border-bottom:1px solid rgba(255,255,255,.14)}
.pointer{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:18px solid var(--gold);filter:drop-shadow(0 2px 6px rgba(160,215,255,.55))}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(214,239,255,.2),transparent 20%,transparent 78%,rgba(6,16,32,.45));pointer-events:none}
.spin-caption{display:flex;align-items:center;justify-content:center;gap:8px;color:#a9d4f5;font-size:12px;font-weight:600;letter-spacing:.6px;margin:0 0 10px}
.spin-caption:before,.spin-caption:after{content:"❄";font-size:11px;opacity:.75}
button{font:inherit;font-weight:700;border:none;border-radius:13px;padding:16px 20px;cursor:pointer;width:100%;transition:transform .16s ease,filter .16s ease}
button:focus-visible{outline:2px solid #bfe6ff;outline-offset:3px}
#spin{background:linear-gradient(105deg,#2467b0,#4aa8ea);color:#fff;font-size:16px;letter-spacing:.2px;box-shadow:0 7px 20px rgba(36,103,176,.4),inset 0 1px 0 rgba(255,255,255,.28)}
#spin:not(:disabled):active{transform:scale(.985);filter:brightness(.96)}
#spin:disabled{opacity:.5;cursor:default}
#freeSpin{background:rgba(190,225,255,.05);color:var(--gold);border:1.5px solid #7fbfee;margin-bottom:10px;font-size:15px}
#freeSpin:not(:disabled):active{transform:scale(.985);filter:brightness(.96)}
#freeSpin:disabled{opacity:.55;cursor:default}
#result{min-height:48px;margin-top:14px;font-size:15px;font-weight:600;color:#e3f1ff}
#cooldown{display:inline-block;color:var(--mute);font-size:12px;margin-top:2px;padding:6px 12px;border:1px solid var(--line);border-radius:30px;background:rgba(190,225,255,.04)}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tab-btn{width:50%;padding:11px 12px;border:1px solid var(--line);background:rgba(190,225,255,.04);color:var(--mute);border-radius:12px;font-size:14px}
.tab-btn.active{background:linear-gradient(105deg,#2467b0,#4aa8ea);color:#fff;border-color:#7fbfee}
.tab-panel{display:none;text-align:left}
.tab-panel.active{display:block}
.inventory-list{display:flex;flex-direction:column;gap:9px}
.inventory-item{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(17,35,59,.75)}
.inventory-item img{width:58px;height:42px;object-fit:cover;border-radius:8px;flex:none}
.inventory-main{min-width:0;flex:1}
.inventory-name{font-weight:800;color:var(--ink)}
.inventory-desc{font-size:12px;color:var(--mute);margin-top:2px}
.inventory-date{font-size:11px;color:#7891a8;margin-top:4px}
.inventory-empty{text-align:center;color:var(--mute);padding:22px 10px;border:1px dashed var(--line);border-radius:13px}
.rules{margin-top:25px;text-align:left;background:linear-gradient(145deg,rgba(24,48,80,.96),rgba(15,32,56,.96));border:1px solid var(--line);border-radius:17px;padding:16px 17px 14px;color:var(--mute);box-shadow:0 12px 28px rgba(0,8,24,.3)}
.rules b{color:var(--ink);font-weight:700}
.rules div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.rules .rules-heading{padding:0 0 9px;margin-bottom:5px;border-bottom:1px solid rgba(150,200,240,.14);font-size:15px}
.rules .chance-label{display:flex;align-items:center;gap:8px}
.rules .chance-label:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.rules .chance-value{font-variant-numeric:tabular-nums;color:#e6f3ff}
@media(max-width:360px){main{padding-left:15px;padding-right:15px}.reel-wrap{max-width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>

<body>
<canvas id="snow" aria-hidden="true"></canvas>

<main>
  <div class="spin-caption">Зимний сезон</div>
  <h1>Рулетка <span>honestiTG</span></h1>
  <div class="sub">Одна прокрутка — 100 ⭐ Telegram Stars</div>

  <div class="reel-wrap">
    <div class="reel-frame photo-reel">
      <div class="reel-strip" id="strip"></div>
      <div class="shade"></div>
    </div>
    <div class="pointer"></div>
  </div>

  <button id="freeSpin" disabled>🎁 Бесплатная прокрутка</button>
  <button id="spin">Крутить за 100 ⭐</button>

  <div style="margin:18px 0 12px">
    <a href="shop.html" class="tab-btn" style="display:block;width:auto;text-align:center;text-decoration:none;color:var(--ink)">🛒 Наличие магазина</a>
  </div>

  <section class="tab-panel active" id="roulettePanel">
    <div id="result" aria-live="polite"></div>
    <div id="cooldown"></div>
  </section>

  <div class="sub" style="margin-top:14px;font-size:11px">
    Оплата проходит через Telegram Stars. Стоимость одной прокрутки — 100 ⭐
  </div>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_BASE = (() => {
  try {
    const q = new URLSearchParams(location.search).get("api");
    if (q) localStorage.setItem("honestitg_api", q);
    return (q || localStorage.getItem("honestitg_api") || "").replace(/\/$/, "");
  } catch {
    return "";
  }
})();

function apiFetch(path, opts = {}) {
  opts.headers = Object.assign(
    {"X-Pinggy-No-Screen": "1"},
    opts.headers || {}
  );
  return fetch(API_BASE + path, opts);
}

const PHOTOS = [
  "assets/fortnite-1.jpg",
  "assets/fortnite-2.jpg",
  "assets/fortnite-3.jpg",
  "assets/fortnite-4.jpg",
  "assets/fortnite-5.jpg",
  "assets/fortnite-6.jpg",
  "assets/fortnite-7.jpg"
];

const strip = document.getElementById("strip");
const frame = document.querySelector(".reel-frame");
const spinButton = document.getElementById("spin");
const resultBox = document.getElementById("result");
const cooldownBox = document.getElementById("cooldown");
const freeButton = document.getElementById("freeSpin");

let isSpinning = false;
let freeMsLeft = 0;

function addPhoto(src, alt) {
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt || "Fortnite аккаунт";
  img.draggable = false;
  strip.appendChild(img);
}

function buildReel() {
  for (let i = 0; i < 18; i++) {
    addPhoto(PHOTOS[i % PHOTOS.length]);
  }
  strip.style.transform = "translateY(0)";
}
buildReel();

function initData() {
  return tg?.initData || "";
}

function fmtLeft(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h + " ч " + m + " мин";
}

function updateFreeButton() {
  freeButton.disabled = isSpinning || freeMsLeft > 0;
  freeButton.textContent =
    freeMsLeft > 0
      ? "Бесплатная прокрутка через " + fmtLeft(freeMsLeft)
      : "🎁 Бесплатная прокрутка";
}

function setBusy(busy, label) {
  isSpinning = busy;
  spinButton.disabled = busy;
  spinButton.textContent =
    label || (busy ? "Оплата / прокрутка…" : "Крутить за 100 ⭐");
  updateFreeButton();
}

function showError(message) {
  resultBox.textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function requestInvoice() {
  if (!tg || !tg.initData) {
    throw new Error("Открой рулетку внутри Telegram, чтобы оплатить прокрутку звёздами.");
  }

  const response = await apiFetch("/api/create-invoice", {
    method: "POST",
    headers: {
      "Content-Type":"application/json",
      "X-Telegram-Init-Data":initData()
    },
    body: JSON.stringify({})
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || !data.invoiceUrl) {
    throw new Error(data.error || "Не удалось создать счёт на оплату.");
  }

  return data.invoiceUrl;
}

function animateToPhoto(index) {
  return new Promise(resolve => {
    const cardHeight = frame.clientHeight;
    const sequence = [];

    for (let i = 0; i < 15; i++) {
      sequence.push(
        PHOTOS[
          (i + Math.floor(Math.random() * PHOTOS.length))
          % PHOTOS.length
        ]
      );
    }

    sequence.push(PHOTOS[index % PHOTOS.length]);
    strip.innerHTML = "";
    sequence.forEach(src => addPhoto(src));

    strip.style.transition = "none";
    strip.style.transform = "translateY(0)";
    void strip.offsetHeight;

    strip.style.transition = "transform 4.2s cubic-bezier(.10,.72,.12,1)";
    strip.style.transform = `translateY(-${(sequence.length - 1) * cardHeight}px)`;

    strip.addEventListener("transitionend", () => resolve(), {once:true});
    setTimeout(resolve, 4500);
  });
}

async function getPaidSpin() {
  for (let attempt = 0; attempt < 12; attempt++) {
    const response = await apiFetch("/api/spin", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Telegram-Init-Data":initData()
      },
      body:JSON.stringify({})
    });

    const data = await response.json().catch(() => ({}));

    if (response.ok) return data;

    if (response.status !== 409) {
      throw new Error(data.error || "Не удалось запустить рулетку.");
    }

    await sleep(1000);
  }

  throw new Error("Оплата ещё подтверждается. Подождите немного и нажмите «Проверить оплату».");
}

spinButton.addEventListener("click", async () => {
  if (isSpinning) return;

  resultBox.textContent = "";
  setBusy(true, "Создаём счёт…");

  try {
    const invoiceUrl = await requestInvoice();

    await new Promise((resolve, reject) => {
      tg.openInvoice(invoiceUrl, status => {
        if (status === "paid") {
          resolve();
        } else if (status === "cancelled") {
          reject(new Error("Оплата отменена."));
        } else {
          reject(new Error("Платёж не завершён. Попробуйте ещё раз."));
        }
      });
    });

    setBusy(true, "Подтверждаем оплату…");
    const prize = await getPaidSpin();

    setBusy(true, "Крутим…");
    await animateToPhoto(prize.imageIndex ?? 0);

    if (prize.name === "Пусто") {
      resultBox.textContent = "В этот раз без приза. Спасибо за участие!";
    } else {
      resultBox.innerHTML =
        `<b>${escapeHtml(prize.name)}</b><br>` +
        `${escapeHtml(prize.desc)}<br>` +
        `<span style="color:var(--mute);font-size:13px">Для получения приза напишите менеджеру.</span>`;
    }

    if (tg?.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred("success");
    }

    cooldownBox.textContent = "Прокрутка оплачена · 100 ⭐";
  } catch (error) {
    showError(error.message || "Что-то пошло не так.");
  } finally {
    setBusy(false);
  }
});

const FREE_PRIZES = [
  {name:"Пусто",desc:"В этот раз ничего не выпало",chance:73,imageIndex:0},
  {name:"1–5 скинов",desc:"+ доступ к почте",chance:15,imageIndex:1},
  {name:"10–20 скинов",desc:"без доступа к почте",chance:6,imageIndex:2},
  {name:"20–50 скинов",desc:"без доступа к почте",chance:3,imageIndex:3},
  {name:"100–150 скинов",desc:"без доступа к почте",chance:2,imageIndex:4},
  {name:"30 скинов",desc:"+ доступ к почте",chance:0.9,imageIndex:5},
  {name:"100 скинов",desc:"+ доступ к почте",chance:0.1,imageIndex:6}
];

const FREE_KEY = "honestitg_free_spin_last";
const FREE_MS = 24 * 60 * 60 * 1000;
let freeServerMode = false;

function pickFreePrizeLocal() {
  let roll = Math.random() * 100;
  let sum = 0;

  for (const p of FREE_PRIZES) {
    sum += p.chance;
    if (roll < sum) return p;
  }
  return FREE_PRIZES[0];
}

function localMsLeft() {
  try {
    return Math.max(0, FREE_MS - (Date.now() - Number(localStorage.getItem(FREE_KEY) || 0)));
  } catch {
    return 0;
  }
}

async function loadFreeStatus() {
  freeServerMode = false;

  try {
    const response = await apiFetch("/api/free-status", {
      headers: {"X-Telegram-Init-Data": initData()}
    });

    const data = await response.json().catch(() => null);

    if (data && (response.ok || response.status === 401)) {
      freeServerMode = true;
      freeMsLeft = response.ok ? Number(data.msLeft || 0) : 0;
    }
  } catch {}

  if (!freeServerMode) {
    freeMsLeft = localMsLeft();
  }

  updateFreeButton();
}

async function getFreePrize() {
  if (!freeServerMode) {
    if (localMsLeft() > 0) {
      throw new Error("Бесплатная прокрутка уже использована.");
    }

    const prize = pickFreePrizeLocal();

    try {
      localStorage.setItem(FREE_KEY, String(Date.now()));
    } catch {}

    return prize;
  }

  if (!tg || !tg.initData) {
    throw new Error("Откройте рулетку внутри Telegram.");
  }

  const response = await apiFetch("/api/free-spin", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "X-Telegram-Init-Data":initData()
    },
    body:JSON.stringify({})
  });

  const prize = await response.json().catch(() => ({}));

  if (response.status === 429) {
    freeMsLeft = Number(prize.msLeft || 0);
    throw new Error(prize.error);
  }

  if (!response.ok) {
    throw new Error(prize.error || "Не удалось запустить прокрутку.");
  }

  return prize;
}

freeButton.addEventListener("click", async () => {
  if (isSpinning || freeMsLeft > 0) return;

  resultBox.textContent = "";
  isSpinning = true;
  updateFreeButton();
  spinButton.disabled = true;

  try {
    const prize = await getFreePrize();
    freeMsLeft = FREE_MS;

    await animateToPhoto(prize.imageIndex ?? 0);

    if (prize.name === "Пусто") {
      resultBox.textContent = "В этот раз без приза. Приходи завтра!";
    } else {
      resultBox.innerHTML =
        `<b>${escapeHtml(prize.name)}</b><br>` +
        `${escapeHtml(prize.desc)}<br>` +
        `<span style="color:var(--mute);font-size:13px">Для получения приза напишите менеджеру.</span>`;
    }

    if (tg?.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred("success");
    }
  } catch (error) {
    showError(error.message || "Что-то пошло не так.");
  } finally {
    isSpinning = false;
    spinButton.disabled = false;
    updateFreeButton();
  }
});

setInterval(() => {
  if (freeMsLeft > 0) {
    freeMsLeft = Math.max(0, freeMsLeft - 30000);
    updateFreeButton();
  }
}, 30000);

loadFreeStatus();

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

cooldownBox.textContent = "Оплата через Telegram Stars";
</script>

<script>
(function(){
  const c = document.getElementById("snow");

  if (!c || matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  const x = c.getContext("2d");
  const d = Math.min(devicePixelRatio || 1, 2);
  const f = [];
  let w, h;

  function rs() {
    w = innerWidth;
    h = innerHeight;
    c.width = w * d;
    c.height = h * d;
    x.setTransform(d,0,0,d,0,0);
  }

  rs();
  addEventListener("resize", rs);

  for (let i = 0; i < 55; i++) {
    f.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2.2 + .6,
      s: Math.random() * .6 + .25,
      p: Math.random() * 6.28
    });
  }

  function t() {
    x.clearRect(0,0,w,h);

    for (const a of f) {
      a.y += a.s;
      a.p += .012;
      a.x += Math.sin(a.p) * .35;

      if (a.y > h + 4) {
        a.y = -4;
        a.x = Math.random() * w;
      }

      x.beginPath();
      x.arc(a.x,a.y,a.r,0,6.283);
      x.fillStyle = "rgba(235,245,255," + (.35 + a.r * .18) + ")";
      x.fill();
    }

    requestAnimationFrame(t);
  }

  t();
})();
</script>

</body>
</html>
